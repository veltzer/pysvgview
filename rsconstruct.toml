# rsconstruct build configuration for this repository.

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.python]

# ─── templating ──────────────────────────────────────────────────────────────

# Convention: tera configs are Lua (config/*.lua). dep_auto entries are
# silently skipped where absent. Repos still on config/*.py keep a
# dep_inputs override in their local overlay until converted.
[processor.tera]
dep_auto = [
	"config/project.lua",
	"config/personal.lua",
	"config/version.lua",
	"config/github.lua",
	"config/python.lua",
	"config/shared.lua",
]
src_dirs = ["tera.templates"]

[processor.ruff]
src_dirs = ["src", "config", "tests"]

[processor.pylint]
src_dirs = ["src", "config", "tests"]

[processor.mypy]
src_dirs = ["src", "config", "tests"]

[processor.pytest]
src_dirs = ["tests"]

[processor.luacheck]
src_dirs = ["config"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.taplo]
src_dirs = ["."]

# lint the GitHub Actions workflow files with actionlint
[processor.actionlint]
src_dirs = [".github/workflows"]

# System libraries PyQt6 loads at import time; the hosted runner is
# headless and ships without them, so pytest's import of the package
# fails with "libEGL.so.1: cannot open shared object file" otherwise.
[dependencies]
system = [
	"libegl1",
	"libgl1",
	"libxkbcommon0",
]
